btn.onclick=function(){lock=true;sk.disabled=true;btn.disabled=true;var all=true;sp.ans.forEach(function(a,k){var ok=fill[k].textContent===a;if(!ok){all=false;slots[k].dataset.fix="→ "+a}slots[k].classList.add(ok?"ok":"no")});
if(all){sfx.good()}else{sfx.bad()}setTimeout(function(){sp.done(all)},all?1100:2300)};
box.appendChild(line);box.appendChild(bank);var w=document.createElement("div");w.style.textAlign="center";w.appendChild(btn);box.appendChild(w);sk=skipBtn(box,function(){lock=true;btn.disabled=true;sp.ans.forEach(function(a,k){slots[k].dataset.fix="→ "+a;slots[k].classList.add("no")});sfx.bad();setTimeout(function(){sp.done(false)},2300)})}
async function finish(){sfx.win();var rec={score:score,total:TOTAL,t:Date.now()},ok=true;
try{if(attempt===1){first=score;await setDoc(doc(fs,"scores",key),{name:name,token:token,first:rec,second:null})}else{second=score;await updateDoc(doc(fs,"scores",key),{second:rec})}}catch(e){ok=false;if(attempt===1)first=score;else second=score}
showResults(ok)}
function cmp(){var d=second-first,m=d>0?"Up "+d:d<0?"Down "+(-d):"Same score";
return'<div class="cmp"><div class="crow"><span>First</span><div class="cb"><i style="width:'+first/TOTAL*100+'%"></i></div><b>'+first+'/'+TOTAL+'</b></div><div class="crow"><span>Second</span><div class="cb"><i class="n" style="width:'+second/TOTAL*100+'%"></i></div><b>'+second+'/'+TOTAL+'</b></div><div class="note"><b>'+m+'.</b> The leaderboard shows your first attempt. Tap the arrow by your name to see your second.</div></div>'}
function showResults(ok){var cur=attempt===2?second:first;
app.innerHTML='<div class="card"><h2 style="margin:0 0 4px">'+esc(name)+': '+cur+'/'+TOTAL+'</h2>'+(attempt===2?cmp():'')+(ok===false?'<p class="note">Your score did not save to the class board.</p>':'')+'<div id="lb"></div><div style="text-align:center">'+(attempt===1?'<button class="go" id="again">Don\'t like your score? Redo it</button>':'<p class="note">Second attempt done.</p>')+'</div></div>';
var a=document.getElementById("again");if(a)a.onclick=function(){au();sfx.click();attempt=2;run()};watch()}
function watch(){if(unsub){try{unsub()}catch(e){}unsub=null}var lb=document.getElementById("lb");if(!lb)return;lb.innerHTML='<p class="note">Loading leaderboard...</p>';
try{unsub=onSnapshot(collection(fs,"scores"),function(s){rowsCache=s.docs.map(function(d){var o=d.data();o.key=d.id;return o});drawLb()},function(){lb.innerHTML='<p class="note">Leaderboard could not load.</p>'})}catch(e){}}
function drawLb(){var lb=document.getElementById("lb");if(!lb)return;var med=["🥇","🥈","🥉"],rows=rowsCache.filter(function(r){return r.first}).sort(function(x,y){return y.first.score-x.first.score||x.first.t-y.first.t}).slice(0,100),h='<table><tr><th>#</th><th>Name</th><th>First try</th></tr>';
rows.forEach(function(r,n){h+='<tr class="'+(r.key===key?'me':'')+'"><td>'+(med[n]||n+1)+'</td><td>'+esc(r.name)+(r.second?' <button class="arr" data-k="'+esc(r.key)+'">'+(open[r.key]?'▾':'▸')+'</button>':'')+'</td><td>'+r.first.score+'/'+r.first.total+'</td></tr>';
if(r.second&&open[r.key]){var d=r.second.score-r.first.score;h+='<tr class="sub"><td></td><td colspan="2">Second try: '+r.second.score+'/'+r.second.total+' ('+(d>0?'up '+d:d<0?'down '+(-d):'same')+')</td></tr>'}});
lb.innerHTML=h+'</table>'}
start();
</script>
